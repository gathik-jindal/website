<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Public notes from Gathik Jindal's Obsidian vault.">
  <title>Notes | Gathik Jindal</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <script>
    // dark by default; light only if the visitor chose it with the toggle.
    // Runs before first paint so the page never flashes.
    (function () {
      var root = document.documentElement;
      var theme = null;
      try { theme = localStorage.getItem("theme"); } catch (e) { }
      if (theme !== "light") theme = "dark";
      root.setAttribute("data-theme", theme);
      root.classList.add("js");
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400..800&display=swap">
  <link rel="stylesheet" href="assets/css/base.css?v=6">
  <link rel="stylesheet" href="assets/css/pages/notes.css?v=6">
</head>

<body class="page page-notes page-with-sidebar">
  <div class="page-curtain" aria-hidden="true"><span><b>gathik</b>jindal</span></div>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="logo" href="./" aria-label="Gathik Jindal home"><span>gathik</span>jindal</a>
      <nav class="topnav" aria-label="Main navigation">
        <a class="hover-pop" href="./">Portfolio</a>
        <a class="hover-pop" href="projects">Projects</a>
        <a class="hover-pop" href="notes" aria-current="page">Notes</a>
        <a class="hover-pop" href="about">About</a>
      </nav>
      <div class="top-actions">
        <button class="icon-button theme-toggle hover-pop" id="themeToggle" type="button"
          aria-label="Switch to dark theme">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4.5" />
            <path
              d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" />
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" />
          </svg>
        </button>
        <a class="icon-button hover-pop" href="https://github.com/gathik-jindal" target="_blank" rel="noreferrer"
          aria-label="GitHub">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.19-3.37-1.19-.45-1.16-1.1-1.46-1.1-1.46-.91-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.9 1.52 2.34 1.08 2.91.83.09-.65.35-1.08.63-1.33-2.22-.25-4.55-1.11-4.55-4.93 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02A9.51 9.51 0 0 1 12 6.01c.85 0 1.7.11 2.5.34 1.9-1.29 2.74-1.02 2.74-1.02.55 1.37.2 2.39.1 2.64.64.7 1.02 1.59 1.02 2.68 0 3.83-2.34 4.67-4.56 4.92.36.31.68.92.68 1.86v2.76c0 .26.18.58.69.48A10 10 0 0 0 12 2Z" />
          </svg>
        </a>
        <a class="upgrade hover-pop" href="about#contact">Hire me</a>
      </div>
    </div>
  </header>

  <div class="app-shell">
    <aside class="sidebar" aria-label="All notes">
      <div class="sidebar-notes">
        <p class="panel-label">All notes</p>
        <div class="sidebar-note-list" id="sidebarNoteList"></div>
      </div>
    </aside>

    <main class="dashboard">
      <section class="panel header-panel">
        <p class="panel-label">Notes dashboard</p>
        <h1 data-split style="--d: 400ms">Concrete notes from my Obsidian vault.</h1>
      </section>

      <section class="notes-board">
        <div class="panel filter-panel">
          <label class="search-label" for="noteSearch">Search notes</label>
          <input class="note-search" id="noteSearch" type="search" placeholder="Search by title, tag, or summary">
          <div class="filter-row">
            <p class="filter-title">Tags</p>
            <button class="outline-button hover-pop tag-toggle" id="tagToggle" type="button">Show more</button>
          </div>
          <div class="tag-list is-collapsed" id="tagList">
            <button class="tag is-active" type="button" data-tag="all">All</button>
          </div>
        </div>
        <div class="post-area">
          <div class="post-grid" id="postGrid" aria-live="polite"></div>
          <article class="panel reader" id="reader" hidden>
            <button class="outline-button hover-pop reader-close" id="readerClose" type="button">Close</button>
            <div id="readerContent"></div>
          </article>
        </div>
      </section>
    </main>
  </div>

  <footer class="site-footer">
    <div class="footer-inner">
      <p class="footer-cta"><span class="footer-kicker">Next step</span><span class="footer-arrow" aria-hidden="true">&rarr;</span>Have an idea, an internship, or a question?</p>
      <div class="footer-actions">
        <a class="blue-button hover-pop" href="about#contact">Contact me</a>
        <a class="text-link" href="https://github.com/gathik-jindal" target="_blank" rel="noreferrer">GitHub</a>
        <a class="text-link" href="https://www.linkedin.com/in/gathik-jindal-10851428b/" target="_blank"
          rel="noreferrer">LinkedIn</a>
        <span class="footer-meta">&copy; 2026 Gathik Jindal</span>
      </div>
    </div>
  </footer>

  <script src="assets/js/main.js?v=6"></script>
  <script src="assets/js/notes.js?v=6"></script>
</body>

</html>
